# =============================================================================
# Nginx Reverse Proxy Configuration for FitLens on Vultr
# Place in: /etc/nginx/sites-available/fitlens.conf
# Enable with: ln -s /etc/nginx/sites-available/fitlens.conf /etc/nginx/sites-enabled/
# =============================================================================

# Upstream Node.js application server
upstream fitlens_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP server (redirects to HTTPS once SSL certificate is obtained)
server {
    listen 80;
    listen [::]:80;
    server_name fitlens.yourdomain.com; # Replace with your domain or Vultr server IP

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment after certbot setup)
    # return 301 https://$host$request_uri;

    # For initial setup before SSL: proxy directly to backend
    location / {
        proxy_pass http://fitlens_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for longer LLM research & TTS generation calls
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Aggressive caching for immutable built static assets
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        proxy_pass http://fitlens_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Gzip compression configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}

